# moveit_servo config for the RV-2FR in gz sim, adapted from melfa_ros2_driver's
# melfa_rv2fr_moveit_config/config/rv2fr_servo.yaml (which targets the real robot).
# Only use_gazebo differs from the vendor default -- everything else (frame names,
# joint names, command_out_topic) already matches this project's setup, since
# rv2fr_gz_bringup's overlay reuses melfa_description's geometry macro directly, so
# the vendor's own SRDF/link/joint names are unchanged.
use_gazebo: true # Whether the robot is started in a Gazebo/gz sim simulation environment

## Properties of incoming commands
command_in_type: "unitless" # in the range [-1:1], as if from joystick/GUI sliders.
scale:
  linear: 0.4  # Max linear velocity, applied to a [-1:1] input. [m/s]
  rotational: 0.8 # Max angular velocity, applied to a [-1:1] input. [rad/s]
  joint: 0.01
system_latency_compensation: 0.04

## Properties of outgoing commands
publish_period: 0.02  # 50 Hz -- plenty for GUI-driven jogging, lighter than the vendor's 250 Hz real-hardware default
low_latency_mode: false

command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

low_pass_filter_coeff: 10.0

## MoveIt properties
move_group_name: rv2fr
planning_frame: rv2fr_base

## Other frames
ee_frame_name: rv2fr_wrist
robot_link_command_frame: rv2fr_wrist

## Stopping behaviour
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Configure handling of singularities and joint limits
lower_singularity_threshold: 100.0
hard_stop_singularity_threshold: 200.0
joint_limit_margin: 0.1

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /forward_position_controller/commands

## Collision checking
check_collisions: true
collision_check_rate: 10.0
collision_check_type: threshold_distance
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
collision_distance_safety_factor: 1000.0
min_allowable_collision_distance: 0.01
